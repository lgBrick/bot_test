<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Games</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Экран выбора игр -->
    <div id="main-screen">
        <div class="search-container">
            <div class="search-wrapper">
                <!-- SVG иконка лупы -->
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Поиск">
            </div>
        </div>

        <div class="games-grid" id="games-container">
            <!-- Сюда JavaScript добавит игры -->
        </div>
    </div>

    <!-- Экран запущенной игры -->
    <div id="game-screen" style="display: none;">
        <!-- Заголовок убираем, так как в игре обычно есть свой UI,
             а кнопка "Назад" будет в нативном хедере Telegram -->
        <div id="game-content"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
