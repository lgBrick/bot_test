<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Center</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Фоновые декоративные элементы (опционально, для красоты) -->
    <div class="ambient-light"></div>

    <!-- Основной экран -->
    <div id="main-screen">

        <!-- Шапка с поиском -->
        <header class="sticky-header">
            <h1 class="app-title">Arcade</h1>
            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Поиск игр...">
                </div>
            </div>

            <!-- Категории (Chips) -->
            <div class="categories-wrapper">
                <div class="categories-scroll" id="categories-container">
                    <!-- JS добавит кнопки -->
                </div>
            </div>
        </header>

        <!-- Сетка игр -->
        <div class="scroll-content">
            <h2 class="section-title">Популярное</h2>
            <div class="games-grid" id="games-container">
                <!-- JS добавит игры -->
            </div>

            <!-- Пустое пространство внизу, чтобы контент не перекрывался баром iOS -->
            <div class="spacer"></div>
        </div>
    </div>

    <!-- Экран игры -->
    <div id="game-screen">
        <div id="game-loader">
            <div class="spinner"></div>
        </div>
        <div id="game-content"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
