<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper TG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menu-screen">
            <div class="menu-header">
                <h1>Сапер</h1>
            </div>

            <div class="presets-list">
                <button class="preset-btn" data-mode="beginner">
                    <div class="preset-info">
                        <span class="mode-title">Новичок</span>
                        <span class="mode-desc">9x9 • 10 мин</span>
                    </div>
                    <div class="preset-score">
                        <span class="score-label">Лучшее:</span>
                        <span class="score-val" id="score-beginner">--:--</span>
                    </div>
                </button>

                <button class="preset-btn" data-mode="amateur">
                    <div class="preset-info">
                        <span class="mode-title">Любитель</span>
                        <span class="mode-desc">16x16 • 40 мин</span>
                    </div>
                    <div class="preset-score">
                        <span class="score-label">Лучшее:</span>
                        <span class="score-val" id="score-amateur">--:--</span>
                    </div>
                </button>

                <button class="preset-btn" data-mode="expert">
                    <div class="preset-info">
                        <span class="mode-title">Эксперт</span>
                        <span class="mode-desc">30x16 • 99 мин</span>
                    </div>
                    <div class="preset-score">
                        <span class="score-label">Лучшее:</span>
                        <span class="score-val" id="score-expert">--:--</span>
                    </div>
                </button>
            </div>

            <div class="custom-section">
                <h3>Своя игра</h3>
                <div class="inputs-row">
                    <div class="input-group">
                        <label for="custom-cols">Ширина</label>
                        <input type="number" id="custom-cols" placeholder="2-30" min="2" max="30" value="10">
                    </div>
                    <div class="input-group">
                        <label for="custom-rows">Высота</label>
                        <input type="number" id="custom-rows" placeholder="2-30" min="2" max="30" value="10">
                    </div>
                    <div class="input-group">
                        <label for="custom-mines">Мины</label>
                        <input type="number" id="custom-mines" placeholder="Min 1" min="1" max="899" value="15">
                    </div>
                </div>
                <button id="start-custom-btn" class="action-btn">Играть</button>
            </div>
        </div>

        <!-- ЭКРАН ИГРЫ -->
        <div id="game-screen" class="hidden">
            <div class="header">
                <button class="icon-btn" id="back-to-menu-btn">
                    <!-- Icon Back -->
                    <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>

                <div class="counters">
                    <div class="counter-pill">🚩 <span id="mines-count">0</span></div>
                    <div class="counter-pill">⏱ <span id="timer">00:00.00</span></div>
                </div>

                <button class="face-btn" id="restart-btn">🙂</button>
            </div>

            <!-- Scroll Wrapper -->
            <div class="scroll-wrapper" id="scroll-wrapper">
                <div class="grid-container" id="grid"></div>
            </div>
        </div>

        <!-- ЭКРАН РЕЗУЛЬТАТА -->
        <div id="result-overlay" class="overlay hidden">
            <div class="overlay-content">
                <div class="result-icon" id="result-emoji">🏆</div>
                <h2 id="result-title">Победа!</h2>
                <p id="result-time" class="result-time">00:00.00</p>
                <div class="overlay-buttons">
                    <button id="overlay-restart-btn" class="action-btn">Заново</button>
                    <button id="overlay-menu-btn" class="text-btn">Меню</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
