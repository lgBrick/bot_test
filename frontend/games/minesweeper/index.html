<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- Шапка: Бомбы, Смайлик, Таймер -->
        <div class="header">
            <div class="counter-box">
                <span id="mines-count">000</span>
            </div>

            <button class="face-btn" id="restart-btn">🙂</button>

            <div class="counter-box">
                <span id="timer">000</span>
            </div>
        </div>

        <!-- Игровое поле -->
        <div class="grid-container" id="grid">
            <!-- Ячейки генерируются через JS -->
        </div>

        <!-- Сообщение о результате (опционально, для красоты) -->
        <div id="result-overlay" class="overlay hidden">
            <div class="overlay-content">
                <h2 id="result-title">Game Over</h2>
                <button id="overlay-restart-btn">Заново</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
