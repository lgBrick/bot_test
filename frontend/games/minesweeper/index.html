<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper TG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">

        <div id="menu-screen">
            <div class="menu-header">
                <h1>Сапер</h1>
                <p class="subtitle">Fair Play • No Guessing</p>
            </div>

            <div class="presets">
                <div class="preset-card" data-mode="beginner">
                    <div class="card-icon">🟢</div>
                    <div class="card-info">
                        <span class="mode-title">Новичок</span>
                        <span class="mode-desc">9x9 • 10 мин</span>
                    </div>
                    <span class="best-score" id="score-beginner">--:--</span>
                </div>
                <div class="preset-card" data-mode="amateur">
                    <div class="card-icon">🟡</div>
                    <div class="card-info">
                        <span class="mode-title">Любитель</span>
                        <span class="mode-desc">16x16 • 40 мин</span>
                    </div>
                    <span class="best-score" id="score-amateur">--:--</span>
                </div>
                <div class="preset-card" data-mode="expert">
                    <div class="card-icon">🔴</div>
                    <div class="card-info">
                        <span class="mode-title">Эксперт</span>
                        <span class="mode-desc">30x16 • 99 мин</span>
                    </div>
                    <span class="best-score" id="score-expert">--:--</span>
                </div>
            </div>

            <div class="custom-section">
                <h3>Своя игра</h3>
                <div class="inputs-row">
                    <div class="input-group">
                        <label>Шир</label>
                        <input type="number" id="custom-cols" min="5" max="30" value="10">
                    </div>
                    <div class="input-group">
                        <label>Выс</label>
                        <input type="number" id="custom-rows" min="5" max="30" value="10">
                    </div>
                    <div class="input-group">
                        <label>Мины</label>
                        <input type="number" id="custom-mines" min="1" value="15">
                    </div>
                </div>
                <button id="start-custom-btn" class="main-btn">Начать игру</button>
            </div>
        </div>

        <div id="game-screen" class="hidden">
            <div class="header">
                <button class="icon-btn" id="back-to-menu-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>

                <div class="status-pill">
                    <span class="pill-icon">🚩</span>
                    <span id="mines-count">00</span>
                </div>

                <button class="status-face" id="restart-btn">🙂</button>

                <div class="status-pill timer-pill">
                    <span class="pill-icon">⏱</span>
                    <span id="timer">00:00</span>
                </div>
            </div>

            <div class="scroll-wrapper">
                <div class="grid-container" id="grid"></div>
            </div>
        </div>

        <div id="result-overlay" class="overlay hidden">
            <div class="overlay-content">
                <div class="result-icon" id="result-emoji">🏆</div>
                <h2 id="result-title">Победа!</h2>
                <p id="result-time" class="result-time">00:00</p>
                <div class="overlay-buttons">
                    <button id="overlay-restart-btn" class="main-btn">Заново</button>
                    <button id="overlay-menu-btn" class="secondary-btn">Меню</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
