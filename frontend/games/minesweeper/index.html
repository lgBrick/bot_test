<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper TG Modern</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div id="menu-screen" class="screen">
            <h1 class="title">Minesweeper</h1>
            <div class="presets">
                <div class="preset-btn" data-mode="beginner">
                    <div class="mode-info">
                        <span class="mode-title">Новичок</span>
                        <span class="mode-desc">9x9 • 10 мин</span>
                    </div>
                    <span class="best-score" id="score-beginner">--:--:--</span>
                </div>
                <div class="preset-btn" data-mode="amateur">
                    <div class="mode-info">
                        <span class="mode-title">Любитель</span>
                        <span class="mode-desc">16x16 • 40 мин</span>
                    </div>
                    <span class="best-score" id="score-amateur">--:--:--</span>
                </div>
                <div class="preset-btn" data-mode="expert">
                    <div class="mode-info">
                        <span class="mode-title">Эксперт</span>
                        <span class="mode-desc">30x16 • 99 мин</span>
                    </div>
                    <span class="best-score" id="score-expert">--:--:--</span>
                </div>
            </div>

            <div class="custom-section card">
                <h3>Своя игра</h3>
                <div class="inputs-row">
                    <input type="number" id="custom-cols" placeholder="W" value="10">
                    <input type="number" id="custom-rows" placeholder="H" value="10">
                    <input type="number" id="custom-mines" placeholder="M" value="15">
                </div>
                <button id="start-custom-btn" class="main-button">Начать</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="header-glass">
                <div class="stat-badge">🚩 <span id="mines-count">000</span></div>
                <button class="icon-btn" id="restart-btn">🔄</button>
                <button class="icon-btn" id="back-to-menu-btn">🏠</button>
                <div class="stat-badge">⏱️ <span id="timer">00:00:00</span></div>
            </div>

            <div class="scroll-wrapper">
                <div class="grid-container" id="grid"></div>
            </div>
        </div>

        <div id="result-overlay" class="overlay hidden">
            <div class="overlay-content card">
                <h2 id="result-title">Victory!</h2>
                <div id="result-time" class="result-time">00:00:00</div>
                <div class="overlay-buttons">
                    <button id="overlay-restart-btn" class="main-button">Снова</button>
                    <button id="overlay-menu-btn" class="secondary-button">Меню</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
