name: Deploy Mini App to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      # --- ВОТ ЭТОТ БЛОК РЕШАЕТ ПРОБЛЕМУ ---
      - name: Перемещаем файлы сайта в корень
        run: |
          cp -r frontend/* . 
          rm -rf frontend
      # -------------------------------------

      - name: Настраиваем Pages
        uses: actions/configure-pages@v5

      - name: Загружаем файлы сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Теперь берем из корня, так как мы их туда переместили

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4