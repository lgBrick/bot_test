name: Deploy Frontend Folder

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Настраиваем Pages
        uses: actions/configure-pages@v5

      # МАГИЯ: Загружаем ТОЛЬКО содержимое папки frontend
      - name: Загружаем файлы сайта
        uses: actions/upload-pages-artifact@v3
        with:
          # Мы указываем путь именно к папке.
          # Плагин сам зайдет внутрь и заберет index.html
          path: '.frontend/'

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4